<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking FIPE - Maiores e Menores Variações</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --container-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #64748b;
            
            --table-header: #f8fafc;
            --positive: #16a34a;
            --negative: #dc2626;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --secondary: #475569;
            
            --table-header: #0f172a;
            --positive: #4ade80;
            --negative: #f87171;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 20px; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; transition: background 0.2s, color 0.2s; }
        .container { max-width: 1200px; margin: auto; background: var(--container-bg); padding: 30px; border-radius: 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--text-main); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; padding: 10px 15px; background: rgba(59, 130, 246, 0.1); border-radius: 0; transition: 0.2s; }
        .back-link:hover { background: rgba(59, 130, 246, 0.2); }
        
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        select, button { padding: 12px 16px; font-size: 14px; border-radius: 0; border: 1px solid var(--border-color); background-color: var(--container-bg); color: var(--text-main); }
        select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        button { background-color: var(--primary); color: white; cursor: pointer; border: none; font-weight: 600; transition: all 0.2s; }
        button:hover { background-color: var(--primary-hover); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        table, th, td { border: 1px solid var(--border-color); }
        th, td { padding: 14px; text-align: left; }
        th { background-color: var(--table-header); font-weight: 600; }
        
        .positive { color: var(--positive); font-weight: bold; }
        .negative { color: var(--negative); font-weight: bold; }
    </style>
</head>
<body>
    <script>
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0;i < ca.length;i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }
        if (getCookie('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="container">
        <a href="/" class="back-link">← Voltar para o Painel</a>
        <h1>Ranking FIPE</h1>
        <p style="text-align: center;">Descubra os veículos que mais se valorizaram, desvalorizaram, ou que possuem o maior e menor preço absoluto na tabela (dados pré-calculados considerando toda a base).</p>

        <div class="controls">
            <select id="rankOrder">
                <option value="desvalorizacao">Maior Desvalorização (Queda de Preço)</option>
                <option value="valorizacao">Maior Valorização (Aumento de Preço)</option>
                <option value="maior_preco">Maior Preço Atual (Mais Caros)</option>
                <option value="menor_preco">Menor Preço Atual (Mais Baratos)</option>
            </select>
            <select id="rankLimit">
                <option value="50">Top 50</option>
                <option value="100" selected>Top 100</option>
                <option value="300">Top 300</option>
            </select>
            <button onclick="loadRanking()">Carregar Ranking</button>
        </div>

        <table id="rankingTable">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Preço Atual</th>
                    <th>Variação</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="6" style="text-align: center;">Clique em Carregar para exibir os dados.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        async function loadRanking() {
            const order = document.getElementById('rankOrder').value;
            const limit = document.getElementById('rankLimit').value;
            const tbody = document.querySelector('#rankingTable tbody');
            
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Carregando...</td></tr>';
            
            try {
                const res = await fetch(`/api/ranking?order=${order}&limit=${limit}`);
                const data = await res.json();
                
                tbody.innerHTML = '';
                
                data.forEach((item, index) => {
                    const preco = formatMoney(item.preco_atual);
                    let varStr = '0.00%';
                    let varClass = '';
                    if (item.variacao_percentual !== null && item.variacao_percentual !== undefined) {
                        const v = parseFloat(item.variacao_percentual);
                        if (v > 0) {
                            varStr = `+${v.toFixed(2)}%`;
                            varClass = 'positive';
                        } else if (v < 0) {
                            varStr = `${v.toFixed(2)}%`;
                            varClass = 'negative';
                        } else {
                            varStr = `0.00%`;
                        }
                    }
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>#${index + 1}</td>
                            <td>${item.marca}</td>
                            <td>${item.modelo}</td>
                            <td>${item.ano_modelo}</td>
                            <td>${preco}</td>
                            <td class="${varClass}">${varStr}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Erro ao carregar o ranking.</td></tr>';
            }
        }

        // Carrega automático ao abrir a página
        window.onload = loadRanking;
    </script>
</body>
</html>
