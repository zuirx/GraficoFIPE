<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking FIPE - Maiores e Menores Variações</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --container-bg: #ffffff;
            --subtle-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.08);
            --primary-border: rgba(37, 99, 235, 0.25);
            --secondary: #64748b;
            
            --table-header: #f8fafc;
            --positive: #16a34a;
            --negative: #dc2626;

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-full: 9999px;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-color: #0b1120;
            --container-bg: #151e32;
            --subtle-bg: #182238;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e3d5a;
            
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: rgba(59, 130, 246, 0.16);
            --primary-border: rgba(96, 165, 250, 0.3);
            --secondary: #475569;
            
            --table-header: #101828;
            --positive: #4ade80;
            --negative: #f87171;

            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.35);
            --shadow-md: 0 4px 8px -1px rgba(0, 0, 0, 0.45);
            --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.55);
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            transition: background 0.2s, color 0.2s;
        }

        .container {
            max-width: 1240px;
            margin: auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            margin: 0 0 24px 0;
            font-size: 26px;
            font-weight: 800;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            border-radius: var(--radius-md);
            transition: all 0.18s ease;
            font-size: 13px;
        }
        .back-link:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }
        
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            justify-content: center;
            background: var(--subtle-bg);
            padding: 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        select, button {
            padding: 10px 16px;
            font-size: 14px;
            font-family: inherit;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--container-bg);
            color: var(--text-main);
            transition: all 0.18s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        
        button {
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            border: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table, th, td {
            border: 1px solid var(--border-color);
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
        }
        th {
            background-color: var(--table-header);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        tbody tr:hover {
            background: rgba(37, 99, 235, 0.03);
        }
        body.dark-mode tbody tr:hover {
            background: rgba(255, 255, 255, 0.025);
        }
        
        .positive { color: var(--positive); font-weight: bold; }
        .negative { color: var(--negative); font-weight: bold; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 16px; }
            .controls { flex-direction: column; }
            select, button { width: 100%; }
        }
    </style>
</head>
<body>
    <script>
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0;i < ca.length;i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }
        if (getCookie('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="container">
        <a href="/" class="back-link">Voltar</a>
        <h1>Ranking FIPE</h1>

        <div class="controls">
            <select id="rankOrder">
                <option value="desvalorizacao">Maior Desvalorização (Queda de Preço)</option>
                <option value="valorizacao">Maior Valorização (Aumento de Preço)</option>
                <option value="maior_preco">Maior Preço Atual (Mais Caros)</option>
                <option value="menor_preco">Menor Preço Atual (Mais Baratos)</option>
            </select>
            <select id="rankLimit">
                <option value="50">Top 50</option>
                <option value="100" selected>Top 100</option>
                <option value="300">Top 300</option>
            </select>
            <button onclick="loadRanking()">Carregar Ranking</button>
        </div>

        <table id="rankingTable">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Preço Atual</th>
                    <th>Variação</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="6" style="text-align: center;">Clique em Carregar para exibir os dados.</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

        async function loadRanking() {
            const order = document.getElementById('rankOrder').value;
            const limit = document.getElementById('rankLimit').value;
            const tbody = document.querySelector('#rankingTable tbody');
            
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Carregando...</td></tr>';
            
            try {
                const res = await fetch(`/api/ranking?order=${order}&limit=${limit}`);
                const data = await res.json();
                
                tbody.innerHTML = '';
                
                data.forEach((item, index) => {
                    const preco = formatMoney(item.preco_atual);
                    let varStr = '0.00%';
                    let varClass = '';
                    if (item.variacao_percentual !== null && item.variacao_percentual !== undefined) {
                        const v = parseFloat(item.variacao_percentual);
                        if (v > 0) {
                            varStr = `+${v.toFixed(2)}%`;
                            varClass = 'positive';
                        } else if (v < 0) {
                            varStr = `${v.toFixed(2)}%`;
                            varClass = 'negative';
                        } else {
                            varStr = `0.00%`;
                        }
                    }
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>#${index + 1}</td>
                            <td>${item.marca}</td>
                            <td>${item.modelo}</td>
                            <td>${item.ano_modelo}</td>
                            <td>${preco}</td>
                            <td class="${varClass}">${varStr}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Erro ao carregar o ranking.</td></tr>';
            }
        }

        // Carrega automático ao abrir a página
        window.onload = loadRanking;
    </script>
</body>
</html>
